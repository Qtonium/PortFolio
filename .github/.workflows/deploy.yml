name: Deploy PortFolio

on:
  workflow_run:
    workflows: ["Build PortFolio"]
    types: [completed]

permissions:
  contents: read
  actions: read 
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # environment:
    #   name: github-pages 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set Artifact Name Based on Branch
        run: |
          if [[ "${{ github.event.workflow_run.head_branch }}" == "release" ]]; then
            echo "VITE_ENV=release" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=dist-release" >> $GITHUB_ENV
          elif [[ "${{ github.event.workflow_run.head_branch }}" == "develop" ]]; then
            echo "VITE_ENV=develop" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=dist-develop" >> $GITHUB_ENV
          else
            echo "Unknown branch, exiting."
            exit 1
          fi

      - name: Wait for Artifact to be Available
        run: sleep 5

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: dist/${{ env.VITE_ENV }}/
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.VITE_ENV }}/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: ${{ env.ARTIFACT_NAME }}
        
